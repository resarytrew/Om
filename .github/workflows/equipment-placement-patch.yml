name: Equipment placement integration

on:
  push:
    branches:
      - agent/equipment-placement

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/equipment-placement
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply equipment placement patch
        run: node scripts/patch_equipment_placement.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Ohm lab: add equipment placement workbench"
          git push origin HEAD:agent/equipment-placement
