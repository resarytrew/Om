name: Camera controls patch

on:
  push:
    branches:
      - agent/camera-controls
    paths:
      - scripts/patch_camera_controls.mjs
      - .github/workflows/camera-controls-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/camera-controls
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply camera controls patch
        run: node scripts/patch_camera_controls.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test TypeScript physics core
        run: npm test -- --run
      - name: Build application
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Ohm lab: enable interactive 3D camera"
          git push origin HEAD:agent/camera-controls
