name: Bundle Ohm studio environment

on:
  push:
    branches:
      - agent/ohm-glb-assets
    paths:
      - .github/workflows/ohm-studio-env.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ohm-glb-assets
      - name: Download Babylon studio environment
        run: |
          mkdir -p public/models/ohm
          curl --fail --location --retry 3 \
            https://assets.babylonjs.com/environments/studio.env \
            --output public/models/ohm/studio.env
          test -s public/models/ohm/studio.env
      - name: Commit bundled environment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/ohm/studio.env
          git diff --cached --quiet && exit 0
          git commit -m "Ohm lab: bundle studio IBL environment"
          git push
