name: Expanded Ohm bench integration

on:
  push:
    branches:
      - agent/expanded-ohm-bench-v2

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/expanded-ohm-bench-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply expanded bench integration
        run: python scripts/patch_expand_ohm_bench.py
      - name: Install dependencies
        run: npm ci
      - name: Test TypeScript
        run: npm test -- --run
      - name: Test scientific Python
        run: |
          python -m pip install numpy
          python -m unittest discover -s python_tests
      - name: Build
        run: npm run build
      - name: Commit production LabScene integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon/LabScene.ts
          git diff --cached --quiet && exit 0
          git commit -m "Ohm lab: integrate expanded bench on latest main"
          git push origin HEAD:agent/expanded-ohm-bench-v2
