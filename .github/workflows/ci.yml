name: PHYSICS LAB CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm install

      - name: Install scientific test dependencies
        run: python -m pip install "numpy>=2,<3"

      - name: Test TypeScript physics core
        run: npm test

      - name: Test Python scientific core
        run: python -m unittest discover -s python_tests -p "test_*.py" -v

      - name: Build application
        run: npm run build
