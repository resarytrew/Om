name: Instrument model patch

on:
  push:
    branches:
      - agent/ohm-instrument-models
    paths:
      - scripts/patch_instrument_models.mjs
      - scripts/patch_instrument_models_ui_tests.mjs
      - .github/workflows/instrument-model-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ohm-instrument-models
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply core instrument model patch
        run: node scripts/patch_instrument_models.mjs || true
      - name: Apply UI and test patch
        run: node scripts/patch_instrument_models_ui_tests.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript tests
        run: npm test -- --run
      - name: Build application
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Ohm lab: add ideal and real instrument models"
          git push origin HEAD:agent/ohm-instrument-models
