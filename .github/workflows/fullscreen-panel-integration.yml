name: Fullscreen panel integration

on:
  push:
    branches:
      - agent/fullscreen-panel-controls

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fullscreen-panel-controls
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply fullscreen panel patch
        run: python scripts/patch_fullscreen_panels.py
      - name: Install dependencies
        run: npm ci
      - name: Test TypeScript
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/renderApp.ts src/styles.css
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Ohm lab: add fullscreen and panel controls"
            git push origin HEAD:agent/fullscreen-panel-controls
          fi
