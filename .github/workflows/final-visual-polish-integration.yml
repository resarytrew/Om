name: Final visual polish integration

on:
  push:
    branches:
      - agent/final-visual-polish

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-visual-polish
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply final visual polish
        run: python scripts/patch_final_visual.py
      - name: Install dependencies
        run: npm ci
      - name: Test TypeScript
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon/LabScene.ts src/rendering/babylon/ProfessionalInstruments.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Ohm lab: complete final visual polish"
            git push origin HEAD:agent/final-visual-polish
          fi
