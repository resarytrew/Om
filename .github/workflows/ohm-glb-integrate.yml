name: Integrate Ohm GLB shells

on:
  push:
    branches:
      - agent/ohm-glb-assets
    paths:
      - scripts/patch_labscene_glb.mjs
      - .github/workflows/ohm-glb-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ohm-glb-assets
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Patch LabScene GLB integration
        run: node scripts/patch_labscene_glb.mjs
      - name: Commit scene integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon/LabScene.ts
          git diff --cached --quiet && exit 0
          git commit -m "Ohm lab: load GLB instrument shells with fallback"
          git push
