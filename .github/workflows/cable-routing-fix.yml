name: Cable routing fix

on:
  push:
    branches:
      - agent/physical-cables-fix
    paths:
      - scripts/fix_cable_routing.mjs
      - .github/workflows/cable-routing-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/physical-cables-fix
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply cable routing fix
        run: node scripts/fix_cable_routing.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Ohm lab: keep physical cables on the bench"
          git push origin HEAD:agent/physical-cables-fix
