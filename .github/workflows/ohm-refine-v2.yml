name: Refine Ohm GLB scene v2

on:
  push:
    branches:
      - agent/ohm-glb-assets
    paths:
      - scripts/refine_ohm_glb_scene_v2.mjs
      - .github/workflows/ohm-refine-v2.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ohm-glb-assets
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply composition refinement
        run: node scripts/refine_ohm_glb_scene_v2.mjs
      - name: Commit refined composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon
          git diff --cached --quiet && exit 0
          git commit -m "Ohm GLB: tighten composition and simplify instrument faces"
          git push
