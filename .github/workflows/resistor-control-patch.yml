name: Interactive resistor integration

on:
  push:
    branches:
      - agent/interactive-resistor
    paths:
      - scripts/patch_resistor_control.mjs
      - .github/workflows/resistor-control-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/interactive-resistor
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply resistor interaction patch
        run: node scripts/patch_resistor_control.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Ohm lab: add interactive resistance control"
          git push origin HEAD:agent/interactive-resistor
