name: Reference material detail integration

on:
  push:
    branches:
      - agent/reference-material-detail-pass

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reference-material-detail-pass
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply detail pass
        run: python scripts/patch_reference_detail_pass.py
      - name: Install dependencies
        run: npm ci
      - name: Test TypeScript
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon/ProfessionalInstruments.ts src/rendering/babylon/LabScene.ts
          git diff --cached --quiet && exit 0
          git commit -m "Ohm lab: upgrade instrument materials and industrial detail"
          git push origin HEAD:agent/reference-material-detail-pass
