name: Physical cable integration

on:
  push:
    branches:
      - agent/physical-cables
    paths:
      - src/rendering/babylon/PhysicalCable.ts
      - scripts/patch_physical_cables.mjs
      - .github/workflows/physical-cables-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/physical-cables
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply physical cable patch
        run: node scripts/patch_physical_cables.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Ohm lab: add physical cable dynamics"
          git push origin HEAD:agent/physical-cables
