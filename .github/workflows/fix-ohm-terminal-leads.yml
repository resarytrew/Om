name: Fix Ohm terminal leads

on:
  push:
    branches:
      - agent/fix-ohm-reference-circuits-pages

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-ohm-reference-circuits-pages
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply 3D terminal lead fix
        run: python scripts/patch_rotated_terminal_leads.py
      - name: Install dependencies
        run: npm ci
      - name: Test TypeScript physics core
        run: npm test -- --run
      - name: Test scientific Python core
        run: |
          python -m pip install "numpy>=2,<3"
          python -m unittest discover -s python_tests -p "test_*.py" -v
      - name: Build application
        run: npm run build
      - name: Commit integrated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon/LabScene.ts src/rendering/babylon/PhysicalCable.ts src/rendering/babylon/ProfessionalInstruments.ts src/rendering/babylon/InstrumentVisualPolish.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix rotated terminal leads and resistor visual artifacts"
          git push origin HEAD:agent/fix-ohm-reference-circuits-pages
