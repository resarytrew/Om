name: Source knob interaction

on:
  push:
    branches:
      - agent/instrument-controls
    paths:
      - scripts/patch_source_knob.mjs
      - .github/workflows/source-knob-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/instrument-controls
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply source knob patch
        run: node scripts/patch_source_knob.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Ohm lab: make source voltage knob interactive"
          git push origin HEAD:agent/instrument-controls
