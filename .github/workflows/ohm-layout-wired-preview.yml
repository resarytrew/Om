name: Ohm wired layout preview

on:
  push:
    branches:
      - agent/ohm-layout-pass
    paths:
      - .github/workflows/ohm-layout-wired-preview.yml

jobs:
  wired-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ohm-layout-pass
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/physics-lab-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Om/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/physics-lab-vite.log
          exit 1
      - name: Assemble circuit and capture canvas
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/Om/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(5200);
          const canvas = page.locator('canvas').first();
          const box = await canvas.boundingBox();
          if (!box) throw new Error('Canvas has no bounding box');
          const click = async (x, y) => {
            await page.mouse.click(box.x + box.width * x, box.y + box.height * y);
            await page.waitForTimeout(180);
          };
          // source+ -> ammeter+
          await click(0.148, 0.532); await click(0.784, 0.646);
          // ammeter- -> resistor A
          await click(0.895, 0.657); await click(0.310, 0.674);
          // resistor B -> source-
          await click(0.537, 0.680); await click(0.191, 0.532);
          // voltmeter+ -> resistor A
          await click(0.568, 0.520); await click(0.310, 0.674);
          // voltmeter- -> resistor B
          await click(0.663, 0.520); await click(0.537, 0.680);
          await page.waitForTimeout(1200);
          await canvas.screenshot({ path: 'artifacts/ohm-layout-wired-preview.png' });
          await browser.close();
          NODE
      - name: Upload wired preview
        uses: actions/upload-artifact@v4
        with:
          name: ohm-layout-wired-preview
          path: artifacts/ohm-layout-wired-preview.png
