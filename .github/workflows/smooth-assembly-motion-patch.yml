name: Smooth assembly motion integration

on:
  push:
    branches:
      - agent/smooth-assembly-motion

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/smooth-assembly-motion
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply smooth assembly patch
        run: python scripts/patch_smooth_assembly_motion.py
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon/LabScene.ts src/ui/renderApp.ts src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Ohm lab: smooth interactions and staged standard assembly"
          git push origin HEAD:agent/smooth-assembly-motion
