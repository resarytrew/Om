name: Instrument rotation and dock integration

on:
  push:
    branches:
      - agent/instrument-rotation-dock

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/instrument-rotation-dock
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Align patch with current scene hint
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'scripts/patch_instrument_rotation_dock.mjs';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace(
            ": 'Drag: вращать камеру · Колесо: приблизить/отдалить · Ctrl + drag: сдвиг · Клик по клемме: провод.';",
            ": 'Прибор: тяните за корпус · Колесо: zoom · Drag по фону: камера · Ctrl + drag: сдвиг · Клик по клемме: провод.';",
          );
          fs.writeFileSync(path, s);
          NODE
      - name: Apply rotation and dock patch
        run: node scripts/patch_instrument_rotation_dock.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/babylon/LabScene.ts src/ui/renderApp.ts src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Ohm lab: rotate instruments and polish equipment dock"
          git push origin HEAD:agent/instrument-rotation-dock
